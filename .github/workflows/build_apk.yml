name: Build Real Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Webview Android App Template
        run: |
          flutter create --org com.godagent.app god_agent_app
          cd god_agent_app
          flutter build apk --release

      - name: Upload Real APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GodAgent-Real-Release-APK
          path: god_agent_app/build/app/outputs/flutter-apk/app-release.apk
